name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build --workspace apps/desktop
      - name: dist (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run dist --workspace apps/desktop
      - name: dist (publish GitHub Release)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish --workspace apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: hopdock-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
          if-no-files-found: error
