name: build

# Every push to main: typecheck + build for all OS, no publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:ssh
      - run: npx tsx --test packages/core/src/errors.test.ts apps/desktop/build-supabase.test.ts apps/desktop/src/main/password-sync.test.ts apps/desktop/src/main/putty-key.test.ts apps/desktop/src/main/update-controller.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace apps/desktop
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:desktop

  dist:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build --workspace apps/desktop
      - run: npm run dist --workspace apps/desktop
      - name: smoke (headless launch check, linux only)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a ./apps/desktop/dist/linux-unpacked/hopdock-desktop --no-sandbox --hopdock-smoke
      # No artifact upload on purpose: Actions zips everything, and binaries
      # ship natively via GitHub Releases on tags (see release.yml).
