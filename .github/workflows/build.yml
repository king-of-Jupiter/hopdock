name: build

# Every push to main: typecheck + build for all OS, no publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:ssh
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace apps/desktop
      - run: npm run test:ui

  dist:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build --workspace apps/desktop
      - run: npm run dist --workspace apps/desktop
      - name: smoke (headless launch check, linux only)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a ./apps/desktop/dist/linux-unpacked/hopdock-desktop --no-sandbox --hopdock-smoke
      # No artifact upload on purpose: Actions zips everything, and binaries
      # ship natively via GitHub Releases on tags (see release.yml).
