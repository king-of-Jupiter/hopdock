name: release

# Tags only: build for all OS and publish a GitHub Release (feeds auto-update).
# Release flow is a single run: git push origin vX.Y.Z
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the release FIRST so parallel matrix jobs only upload into it.
  # (electron-builder races getOrCreateRelease and forks duplicate releases.)
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Hopdock $TAG" --draft=false --prerelease=false
          fi

  dist:
    needs: prepare
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build --workspace apps/desktop
      - name: dist (publish GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish --workspace apps/desktop
      - name: smoke (headless launch check, linux only)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a ./apps/desktop/dist/linux-unpacked/hopdock-desktop --no-sandbox --hopdock-smoke
