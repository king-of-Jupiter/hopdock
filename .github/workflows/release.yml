name: release

# Tags only: build for all OS and publish a GitHub Release (feeds auto-update).
# Release flow is a single run: git push origin vX.Y.Z
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dist:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build --workspace apps/desktop
      - name: dist (publish GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish --workspace apps/desktop
